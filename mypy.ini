[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True

# Exclude legacy and third-party modules
[mypy-utils.open_clip.*]
ignore_errors = True

[mypy-diffusers.*]
ignore_errors = True

[mypy-transformers.*]
ignore_errors = True

[mypy-torch.*]
ignore_errors = True

[mypy-torchvision.*]
ignore_errors = True

[mypy-PIL.*]
ignore_errors = True

[mypy-numpy.*]
ignore_errors = True

[mypy-accelerate.*]
ignore_errors = True

[mypy-wandb.*]
ignore_errors = True

[mypy-peft.*]
ignore_errors = True