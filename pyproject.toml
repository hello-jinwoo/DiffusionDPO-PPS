[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | utils/open_clip
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["utils/open_clip/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"